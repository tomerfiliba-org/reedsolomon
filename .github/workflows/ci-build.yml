# This workflow will install Python dependencies and run tests with a variety of Python versions
# It uses the Python Package GitHub Actions workflow.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# and https://www.youtube.com/watch?v=l6fV09z5XHk

name: Unit Tests

on:
  push:
    branches:
      - master # $default-branch only works in Workflows templates, not in Workflows, see https://stackoverflow.com/questions/64781462/github-actions-default-branch-variable
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  unittests:
    name: Unit tests on a matrix of Python versions and OSes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"] # check the list of versions: https://github.com/actions/python-versions/releases and https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md -- note that "*" represents the latest stable version of Python
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest] # jobs that run on Windows and macOS runners that GitHub hosts consume minutes at 2 and 10 times the rate that jobs on Linux runners consume respectively. But it's free for public OSS repositories.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv with python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: |
          uv run python --version

      - name: Install project
        run: |
          uv sync --all-groups

      - name: Test with pytest
        run: |
          uv run coverage run --branch -m pytest -v
          uv run coverage report -m

      - name: Send coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: uv run coveralls --service=github

      - name: Twine check
        if: ${{ matrix.python-version == '3.14' }}
        run: |
          uv build --all-packages --sdist
          uv run twine check "dist/*"
          uv run rstcheck README.rst

      - name: pyproject.toml validity
        if: ${{ matrix.python-version == '3.14' }}
        run: |
          uv run validate-pyproject pyproject.toml packages/creedsolo/pyproject.toml -v

  coveralls:
    name: Wrap up Coveralls report
    needs: unittests
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "false"
          ignore-empty-workdir: "false"

      - name: Finished
        run: uvx coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
