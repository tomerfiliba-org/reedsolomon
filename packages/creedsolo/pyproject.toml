[build-system]
# never uppercap requirements unless we have evidence it won't work https://iscinumpy.dev/post/bound-version-constraints/
requires = [
    "scikit-build-core>=0.10",
    "cython>=3.2",
    "cython-cmake>=0.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "creedsolo"
version = "2.2.0b1"
description = "Pythonic universal errors-and-erasures Reed-Solomon codec to protect your data from errors and bitrot, speed-optimized Cython/C extension."
authors = [
    { name = "Tomer Filiba", email = "tomerfiliba@gmail.com" },
    { name = "Stephen Karl Larroque", email = "lrq3000@gmail.com" },
]
maintainers = [{ name = "Stephen Karl Larroque", email = "lrq3000@gmail.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "data",
    "protection",
    "correction",
    "recovery",
    "restore",
    "save",
    "data-recovery",
    "reed-solomon",
    "error-correction-code",
    "qr",
    "qr-codes",
    "barcodes",
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: The Unlicense (Unlicense)",            # Unlicense OR MIT-0 at the user preference
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
]

[dependency-groups]
dev = [
    "ipython>=8.38.0",
    "nox>=2026.2.9",
    "ruff>=0.15.1",
]
test = [  # minimum dependencies to run tests
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "coveralls>=4.0",
    "cython>=3.2"
]
testmeta = [  # dependencies to test meta-data. Note that some of these dependencies make cibuildwheel choke on cryptography
    "twine>=6.2",
    "validate-pyproject>=0.25",
    "rstcheck>=6.2",
]
testoptional = [  # dependencies for additional optional tests
    "unireedsolomon>=1.0"
]


[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
logging.level = "DEBUG"
cmake.version = "CMakeLists.txt"
cmake.build-type = "Release"
ninja.make-fallback = true
wheel.expand-macos-universal-tags = true
wheel.install-dir = "creedsolo"
wheel.packages = ["src/creedsolo"]
wheel.exclude = ["**.pyx", "**.c"]


[[tool.scikit-build.overrides]]
if.env.CMAKE_PYTHON_DIST_FORCE_NINJA_DEP = true
ninja.make-fallback = false

[[tool.scikit-build.overrides]]
if.state = "metadata_wheel"
wheel.cmake = false
wheel.platlib = true


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--strict-markers",
]
xfail_strict = true
testpaths = "tests"  # default path to look for tests if nothing is specified in commandline
filterwarnings = [
    "once::Warning",
]

[tool.cibuildwheel]

build-verbosity = 1
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
archs = ["auto"]

build-frontend = { name = "build[uv]" }
environment = { CMAKE_PYTHON_DIST_FORCE_NINJA_DEP = "1" }
before-build = "uv tool run nox -f {package}/noxfile.py -s cibuild_prepare"

#before-all = ""
#before-build = ""
#repair-wheel-command = ""

test-command = "pytest {package}/tests"
before-test = "uv sync --no-install-project --active --group test --group testoptional --group testcreedsolo"

# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.

# While black is awesome, it does not support cython, so we avoid for the moment
# to keep a similar formatting between the pure python and the cython implementations.
# see: https://github.com/psf/black/issues/359

#[tool.black]
#line-length = 88
#target-version = ['py39', 'py310', 'py311']
#include = '\.pyi?$'
# We use preview style for formatting Black itself. If you
# want stable formatting across releases, you should keep
# this off.
#preview = false
